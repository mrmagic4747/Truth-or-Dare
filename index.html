<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sach ya Jhoot — Truth or Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #120821;
    --bg2: #1c0f33;
    --bg3: #241340;
    --truth: #2dd4bf;
    --truth-dim: #1a5f57;
    --dare: #ff3d6e;
    --dare-dim: #7a1d33;
    --gold: #ffc857;
    --text: #f5f0ff;
    --muted: #a695c9;
    --card-bg: #180b2c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #2a1650 0%, var(--bg) 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* Ambient stage lights */
  .stage-lights {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .stage-lights span {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.6); }
  }

  .app {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-family: 'Baloo 2', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 42px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, var(--truth), var(--gold) 50%, var(--dare));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 36px;
  }

  /* ---------- SETUP SCREEN ---------- */
  .card {
    background: var(--bg2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--bg3);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--gold);
  }
  input[type="text"]::placeholder {
    color: var(--muted);
  }

  button {
    font-family: 'Baloo 2', sans-serif;
    cursor: pointer;
    border: none;
    outline: none;
  }
  button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  .btn-add {
    background: var(--gold);
    color: #1a0f00;
    font-weight: 700;
    font-size: 22px;
    width: 52px;
    border-radius: 12px;
    transition: transform 0.15s;
  }
  .btn-add:active { transform: scale(0.93); }

  .player-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
    min-height: 8px;
  }

  .player-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg3);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 15px;
    font-weight: 500;
    animation: pop-in 0.25s ease;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .player-chip .num {
    color: var(--gold);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    margin-right: 10px;
  }
  .player-chip .remove {
    background: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .player-chip .remove:hover { color: var(--dare); }

  .empty-hint {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 8px 0 4px;
  }

  .btn-start {
    width: 100%;
    background: linear-gradient(90deg, var(--truth), #22a89a);
    color: #062420;
    font-size: 19px;
    font-weight: 700;
    padding: 16px;
    border-radius: 14px;
    letter-spacing: 0.01em;
    transition: transform 0.15s, opacity 0.2s;
  }
  .btn-start:disabled {
    background: var(--bg3);
    color: var(--muted);
    cursor: not-allowed;
  }
  .btn-start:not(:disabled):active { transform: scale(0.98); }

  /* ---------- GAME SCREEN ---------- */
  .game-screen { display: none; }
  .game-screen.active { display: block; }
  .setup-screen.hidden { display: none; }

  .round-tag {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .spotlight {
    position: relative;
    background: radial-gradient(circle at 50% 20%, rgba(255,200,87,0.18), transparent 60%),
                var(--bg2);
    border-radius: 24px;
    padding: 40px 24px 32px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
    min-height: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.45);
  }

  .name-label {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .player-name {
    font-family: 'Baloo 2', sans-serif;
    font-size: 38px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 28px;
    min-height: 48px;
    text-shadow: 0 0 30px rgba(255,200,87,0.3);
  }
  .player-name.scrambling {
    color: var(--muted);
    text-shadow: none;
  }

  .btn-spin {
    background: linear-gradient(90deg, var(--gold), #ffb020);
    color: #1a0f00;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 50px;
    box-shadow: 0 8px 24px rgba(255,200,87,0.25);
    transition: transform 0.15s;
  }
  .btn-spin:active { transform: scale(0.96); }
  .btn-spin:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* card flip reveal */
  .reveal-card {
    width: 100%;
    perspective: 1200px;
    display: none;
  }
  .reveal-card.show { display: block; }

  .flip-inner {
    position: relative;
    width: 100%;
    min-height: 220px;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  }
  .flip-inner.flipped { transform: rotateY(180deg); }

  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .flip-front {
    background: var(--card-bg);
    border: 2px dashed rgba(255,255,255,0.12);
  }
  .flip-front .qmark {
    font-family: 'Baloo 2', sans-serif;
    font-size: 60px;
    color: var(--muted);
    opacity: 0.4;
  }
  .flip-back {
    transform: rotateY(180deg);
    color: #fff;
  }
  .flip-back.truth {
    background: linear-gradient(160deg, var(--truth-dim), #0d2e2a);
    border: 2px solid var(--truth);
  }
  .flip-back.dare {
    background: linear-gradient(160deg, var(--dare-dim), #350c19);
    border: 2px solid var(--dare);
  }

  .type-badge {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 30px;
    margin-bottom: 16px;
  }
  .type-badge.truth { background: var(--truth); color: #04211d; }
  .type-badge.dare { background: var(--dare); color: #2e0512; }

  .question-text {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.5;
    text-align: center;
  }

  .btn-next {
    width: 100%;
    background: var(--bg3);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    padding: 15px;
    border-radius: 14px;
    margin-top: 20px;
    display: none;
    border: 1.5px solid rgba(255,255,255,0.1);
    transition: transform 0.15s, border-color 0.2s;
  }
  .btn-next.show { display: block; }
  .btn-next:hover { border-color: var(--gold); }
  .btn-next:active { transform: scale(0.98); }

  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 20px;
  }
  .footer-note button {
    background: none;
    color: var(--muted);
    text-decoration: underline;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .footer-note button:hover { color: var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 400px) {
    h1 { font-size: 32px; }
    .player-name { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="stage-lights" id="stageLights"></div>

<div class="app">
  <div class="eyebrow">5 Dost • 1 Screen • Sach Chupega Nahi</div>
  <h1>Sach ya Jhoot</h1>
  <p class="subtitle">Truth or Dare — bas naam daalo, baaki hum sambhaal lenge</p>

  <!-- SETUP SCREEN -->
  <div class="setup-screen" id="setupScreen">
    <div class="card">
      <div class="add-row">
        <input type="text" id="playerInput" placeholder="Player ka naam likho..." maxlength="18">
        <button class="btn-add" id="addBtn" aria-label="Player add karo">+</button>
      </div>
      <div class="player-list" id="playerList"></div>
      <div class="empty-hint" id="emptyHint">Kam se kam 2 players add karo shuru karne ke liye</div>
      <button class="btn-start" id="startBtn" disabled>Game Shuru Karo</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="game-screen" id="gameScreen">
    <div class="round-tag" id="roundTag">Round 1</div>
    <div class="spotlight">
      <div class="name-label">Baari hai</div>
      <div class="player-name" id="playerNameDisplay">?</div>

      <button class="btn-spin" id="spinBtn">🎲 Naam Choose Karo</button>

      <div class="reveal-card" id="revealCard">
        <div class="flip-inner" id="flipInner">
          <div class="flip-face flip-front">
            <div class="qmark">?</div>
          </div>
          <div class="flip-face flip-back" id="flipBack">
            <div class="type-badge" id="typeBadge">Truth</div>
            <div class="question-text" id="questionText"></div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn-next" id="nextBtn">Next Round →</button>
    <div class="footer-note"><button id="restartBtn">Naye players ke saath shuru karo</button></div>
  </div>
</div>

<script>
  // ---------- Data ----------
  const truthQuestions = [
    "Aapki sabse embarrassing memory kya hai jo aapne kisi ko nahi batayi?",
    "Kya kabhi kisi teacher pe crush hua tha?",
    "Aapka phone kisi ko dena pada aur wo aapki chats dekh le — sabse zyada dar kis cheez ka lagega?",
    "Sabse bada jhoot jo aapne apne parents se bola ho?",
    "Is group mein sabse zyada gossip kiske baare mein karte ho?",
    "Kabhi kisi ka number save karke bina baat kiye 6 mahine tak rakha hai?",
    "Aapki last Instagram DM kisko thi aur usme kya likha tha (summary batao)?",
    "Kya kabhi exam mein cheating ki hai? Kaise pakde jaate jaate bache?",
    "Is room mein kiska crush hone ka sabse zyada chance hai?",
    "Aapne kabhi kisi rishtedar ka naam bhool ke awkward moment create kiya hai?",
    "Sach batao — aap apne ex ka Instagram kitni baar stalk karte ho?",
    "Kya kabhi kisi ko block karke phir unblock kiya hai? Kyun?",
    "Aapke phone mein sabse ajeeb screenshot kaunsa hai?",
    "Kabhi kisi dost ka secret kisi aur ko bata diya ho?",
    "Aapka sabse bada fear kya hai jo aapne kabhi kisi ko nahi bataya?",
    "Kya kabhi crush ke saamne bewakoofi ki ho aur wo abhi tak yaad ho?",
    "Aap apni body mein sabse zyada kis cheez ko lekar insecure ho?",
    "Kya kabhi kisi ke bare mein bura socha ho jo aapka close dost hai?",
    "Sabse recent jhoot jo aapne aaj bola ho?",
    "Kya aap kabhi kisi se jealous hue ho is room mein?",
    "Aapne kabhi apne parents ka phone check kiya hai unse chupke?",
    "Sabse embarrassing song jo aap akele mein gate ho?",
    "Kya kabhi kisi ne aapko friendzone kiya ho?",
    "Aapka sabse bada regret kya hai is saal ka?",
    "Kya aapne kabhi kisi crush ko like karne ke baad turant unfollow kiya ho?",
    "Sach batao, is group mein sabse pehle shaadi kisiki hogi lagta hai?",
    "Kya kabhi aapne kisi ka birthday jaan-boojh kar bhula diya ho?",
    "Aap sabse zyada kis cheez ke liye apne parents se darte ho?",
    "Kya kabhi rote hue gaana suna hai? Kaunsa tha?",
    "Aapka weirdest search history mein kya hai jo yaad hai?"
  ];

  const dareQuestions = [
    "Ek glass paani mein ek chammach namak daalke piyo",
    "Bahar jaake kisi bhi ghar ki bell bajao aur bina bataye bhaag aao",
    "Apne crush ka naam zor se chillao (agar crush nahi hai to apne pyaar ka naam bana lo)",
    "Agle 2 rounds tak sirf gaane mein baat karo",
    "Apni last WhatsApp chat ka ek message zor se padho (jo bhi ho)",
    "Group ke kisi ek member ko '3 din ke liye mera fan' bol ke ek compliment do",
    "1 minute tak bina hasse seedhe kisi ki aankhon mein dekho",
    "Apne ghar wale kisi bhi cupboard se pehli cheez nikaalo aur usko 2 minute pehno",
    "Ek 30 second ka fake ad banao kisi random cheez ke liye jo saamne pade ho",
    "Sabse ajeeb selfie lo aur group ko dikhao (post karne ki zaroorat nahi)",
    "Apne parents ko voice message bhejo 'I love you' bolke, bina wajah",
    "Robot ki tarah chalke pura kamra ek chakkar lagao",
    "Apni favourite movie ka ek dialogue emotional acting ke saath bolo",
    "5 baar bina ruke apna full naam ulta bolne ki koshish karo",
    "Ek push-up karo har us baar jab tum 'sach' bolte ho next 10 minute mein",
    "Kisi bhi ek member ko apne haathon se ek chhota origami banake do",
    "2 minute tak bina blink kiye kisi ko dekhne ki koshish karo",
    "Apne phone ka last photo bina explain kiye group ko dikhao",
    "Ek freestyle rap banao apne doston ke naam use karke",
    "Kisi random contact ko call karke 'Happy Birthday' bolo aur turant kaato",
    "Apni awaaz ko cartoon character jaisi banake agla round khelo",
    "Ek minute tak sirf 'meow' bolke communicate karo",
    "Apne ghar ke kisi member ko bina wajah bologo 'aap best ho'",
    "Group photo lo sabse ajeeb face banake",
    "5 jumping jacks karo gaana gaate hue",
    "Apna coffee/chai order kisi filmy style mein 'act' karke batao",
    "Blindfold laga ke kisi doston ka chehra touch karke pehchano",
    "Apni dance move dikhao 15 second ke liye bina gaane ke",
    "Ek imaginary interview do jaisे aap celebrity ho",
    "Apne phone ke last 3 emoji searches dikhao group ko"
  ];

  let usedTruth = new Set();
  let usedDare = new Set();
  let players = [];
  let lastPlayer = null;
  let currentRound = 1;
  let isRevealed = false;

  // ---------- Ambient stage lights ----------
  const lightsContainer = document.getElementById('stageLights');
  for (let i = 0; i < 25; i++) {
    const dot = document.createElement('span');
    dot.style.left = Math.random() * 100 + '%';
    dot.style.top = Math.random() * 100 + '%';
    dot.style.animationDelay = (Math.random() * 3) + 's';
    lightsContainer.appendChild(dot);
  }

  // ---------- Setup screen logic ----------
  const playerInput = document.getElementById('playerInput');
  const addBtn = document.getElementById('addBtn');
  const playerList = document.getElementById('playerList');
  const emptyHint = document.getElementById('emptyHint');
  const startBtn = document.getElementById('startBtn');

  function renderPlayers() {
    playerList.innerHTML = '';
    players.forEach((name, idx) => {
      const chip = document.createElement('div');
      chip.className = 'player-chip';
      chip.innerHTML = `<span><span class="num">${idx + 1}.</span>${escapeHtml(name)}</span>
        <button class="remove" aria-label="Remove ${escapeHtml(name)}" data-idx="${idx}">×</button>`;
      playerList.appendChild(chip);
    });
    emptyHint.style.display = players.length === 0 ? 'block' : 'none';
    startBtn.disabled = players.length < 2;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addPlayer() {
    const name = playerInput.value.trim();
    if (!name) return;
    if (players.includes(name)) {
      playerInput.value = '';
      return;
    }
    players.push(name);
    playerInput.value = '';
    playerInput.focus();
    renderPlayers();
  }

  addBtn.addEventListener('click', addPlayer);
  playerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addPlayer();
  });

  playerList.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove')) {
      const idx = parseInt(e.target.dataset.idx, 10);
      players.splice(idx, 1);
      renderPlayers();
    }
  });

  startBtn.addEventListener('click', () => {
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.add('active');
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    players = [];
    usedTruth = new Set();
    usedDare = new Set();
    lastPlayer = null;
    currentRound = 1;
    renderPlayers();
    resetRoundUI();
    document.getElementById('gameScreen').classList.remove('active');
    document.getElementById('setupScreen').classList.remove('hidden');
  });

  // ---------- Game screen logic ----------
  const spinBtn = document.getElementById('spinBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playerNameDisplay = document.getElementById('playerNameDisplay');
  const revealCard = document.getElementById('revealCard');
  const flipInner = document.getElementById('flipInner');
  const flipBack = document.getElementById('flipBack');
  const typeBadge = document.getElementById('typeBadge');
  const questionText = document.getElementById('questionText');
  const roundTag = document.getElementById('roundTag');

  function pickRandomPlayer() {
    let pool = players;
    if (players.length > 1 && lastPlayer !== null) {
      pool = players.filter(p => p !== lastPlayer);
    }
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    lastPlayer = chosen;
    return chosen;
  }

  function pickQuestion(type) {
    const bank = type === 'truth' ? truthQuestions : dareQuestions;
    const used = type === 'truth' ? usedTruth : usedDare;
    if (used.size >= bank.length) used.clear(); // reset pool when exhausted
    let idx;
    do {
      idx = Math.floor(Math.random() * bank.length);
    } while (used.has(idx));
    used.add(idx);
    return bank[idx];
  }

  function scrambleName(finalName, duration = 1100) {
    return new Promise(resolve => {
      playerNameDisplay.classList.add('scrambling');
      const startTime = Date.now();
      const interval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        if (elapsed >= duration) {
          clearInterval(interval);
          playerNameDisplay.classList.remove('scrambling');
          playerNameDisplay.textContent = finalName;
          resolve();
          return;
        }
        const randomPlayer = players[Math.floor(Math.random() * players.length)];
        playerNameDisplay.textContent = randomPlayer;
      }, 80);
    });
  }

  function resetRoundUI() {
    playerNameDisplay.textContent = '?';
    revealCard.classList.remove('show');
    flipInner.classList.remove('flipped');
    nextBtn.classList.remove('show');
    spinBtn.disabled = false;
    spinBtn.style.display = 'inline-block';
    isRevealed = false;
  }

  async function playRound() {
    spinBtn.disabled = true;
    revealCard.classList.remove('show');
    flipInner.classList.remove('flipped');

    const chosenPlayer = pickRandomPlayer();
    await scrambleName(chosenPlayer);

    // decide truth or dare
    const type = Math.random() < 0.5 ? 'truth' : 'dare';
    const question = pickQuestion(type);

    typeBadge.textContent = type === 'truth' ? 'Truth' : 'Dare';
    typeBadge.className = 'type-badge ' + type;
    flipBack.className = 'flip-face flip-back ' + type;
    questionText.textContent = question;

    revealCard.classList.add('show');
    spinBtn.style.display = 'none';

    // slight delay before flip for suspense
    await new Promise(r => setTimeout(r, 300));
    flipInner.classList.add('flipped');

    isRevealed = true;
    nextBtn.classList.add('show');
  }

  spinBtn.addEventListener('click', playRound);

  nextBtn.addEventListener('click', () => {
    currentRound += 1;
    roundTag.textContent = 'Round ' + currentRound;
    resetRoundUI();
  });
</script>

</body>
</html>
